<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Know Weather</title>
    <link rel="stylesheet" href="styles.css?v=20260724-1" />
  </head>
  <body data-weather="default" data-period="day">
    <script>
      (() => {
        const hour = new Date().getHours();
        document.body.dataset.period = hour >= 6 && hour < 18 ? "day" : "night";
      })();
    </script>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="react-app.js?v=20261028-1"></script>
    <script src="weather-effects.js"></script>
    <script src="script.js?v=20260724-2"></script>
  </body>
</html>
